name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check i18n parity
        run: npm run check:i18n

      - name: Type check
        run: npm run typecheck

      - name: Check SEO metadata
        run: npm run check:seo

      - name: Build site
        run: npm run build

      - name: Check built SEO
        run: npm run check:built-seo
